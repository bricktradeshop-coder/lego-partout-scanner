name: LEGO 24/7 Part-Out Scanner

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lego-scanner
  cancel-in-progress: false

jobs:
  run-scanner:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repository laden
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Pakete installieren
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
        run: |
          pip install requests
          case "${AI_PROVIDER:-gemini}" in
            anthropic) pip install anthropic ;;
            openai)    pip install openai ;;
            *)         pip install google-genai ;;
          esac

      - name: Scanner ausführen
        env:
          REBRICKABLE_KEY: ${{ secrets.REBRICKABLE_KEY }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MYDEALZ_RSS_URL: ${{ secrets.MYDEALZ_RSS_URL }}
          BRICKMERGE_TG_CHANNEL: ${{ secrets.BRICKMERGE_TG_CHANNEL }}
          # KI-Anbieter: nur der Key des gewählten Anbieters muss gesetzt sein
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          AI_PROVIDER: ${{ vars.AI_PROVIDER }}
          AI_MODEL: ${{ vars.AI_MODEL }}
          USED_PREFILTER: ${{ vars.USED_PREFILTER }}
          NOTIFY_EVERY_RUN: ${{ vars.NOTIFY_EVERY_RUN }}
        run: python lego_scanner.py

      - name: Gesehene Deals speichern (Anti-Duplikat)
        if: always()
        run: |
          if [ ! -f seen_deals.json ]; then exit 0; fi
          git config user.name "LEGO Bot"
          git config user.email "bot@users.noreply.github.com"
          git add seen_deals.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update seen deals"
          for i in 1 2 3; do
            git pull --rebase -X theirs && git push && exit 0
            sleep 5
          done
          exit 1
